<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QA Automation Assistant</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body>
  <div class="app" x-data="chatApp()" x-init="init()" x-cloak>
    <header class="header">
      <div class="brand">
        <div class="logo">✦</div>
        <div>
          <h1>QA Automation Assistant</h1>
          <p>High-level QA automation guidance · powered by Gemini</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-ghost" @click="showKeyModal = true">API Key</button>
        <button class="btn-clear" @click="clearHistory()" :disabled="loading || messages.length === 0">
          Clear history
        </button>
      </div>
    </header>

    <div class="info-banner" x-show="!apiKey && !showKeyModal">
      Enter your Gemini API key to start chatting.
      <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style="color:#b8b3ff">Get a key</a>
    </div>

    <div class="error-banner" x-show="error" x-text="error"></div>

    <section class="chat-panel">
      <div class="messages" x-ref="messages">
        <template x-if="messages.length === 0 && !loading">
          <div class="empty-state">
            <div class="icon">💬</div>
            <p><strong>Ask a QA automation question</strong></p>
            <p>Test strategy, frameworks, CI/CD, Playwright, Cypress, and more.</p>
          </div>
        </template>

        <template x-for="msg in messages" :key="msg.id">
          <div class="message" :class="msg.role">
            <div class="avatar" x-text="msg.role === 'user' ? 'You' : 'QA'"></div>
            <div class="bubble" x-text="msg.content"></div>
          </div>
        </template>

        <template x-if="loading">
          <div class="message assistant">
            <div class="avatar">QA</div>
            <div class="typing"><span></span><span></span><span></span></div>
          </div>
        </template>
      </div>

      <form class="composer" @submit.prevent="sendMessage()">
        <textarea
          x-model="input"
          placeholder="Ask about test automation, frameworks, CI/CD…"
          rows="1"
          :disabled="loading"
          @keydown.enter.prevent="if (!$event.shiftKey) sendMessage()"
        ></textarea>
        <button class="btn-send" type="submit" :disabled="loading || !input.trim() || !apiKey">
          Send
        </button>
      </form>
    </section>

    <div class="modal-backdrop" x-show="showKeyModal" @click.self="showKeyModal = false">
      <div class="modal">
        <h2>Gemini API Key</h2>
        <p>Your key is stored only in this browser (localStorage). Get one at Google AI Studio.</p>
        <input type="password" x-model="apiKeyInput" placeholder="Paste your API key" />
        <div class="modal-actions">
          <button class="btn-ghost" @click="showKeyModal = false">Cancel</button>
          <button class="btn-send" @click="saveApiKey()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "qa-chat-history";
    const API_KEY_STORAGE = "qa-gemini-api-key";
    const MODEL = "gemini-2.5-flash";
    const FALLBACK_MODEL = "gemini-2.5-flash-lite";
    const SYSTEM_PROMPT = `You are a senior QA Automation expert. Answer at a high level: test strategy, automation frameworks, CI/CD, quality gates, tooling trade-offs, and best practices.
Keep answers clear, practical, and structured. Prefer concepts over long code blocks unless the user asks for examples.
When relevant, reference Playwright, Cypress, Selenium, API testing, and test reporting. Help users think like a QA automation lead.`;

    function chatApp() {
      return {
        messages: [],
        input: "",
        loading: false,
        error: "",
        apiKey: "",
        apiKeyInput: "",
        showKeyModal: false,

        init() {
          this.apiKey = localStorage.getItem(API_KEY_STORAGE) || "";
          this.apiKeyInput = this.apiKey;
          this.loadHistory();
          if (!this.apiKey) this.showKeyModal = true;
        },

        saveApiKey() {
          this.apiKey = this.apiKeyInput.trim();
          if (!this.apiKey) {
            this.error = "API key is required.";
            return;
          }
          localStorage.setItem(API_KEY_STORAGE, this.apiKey);
          this.showKeyModal = false;
          this.error = "";
        },

        loadHistory() {
          try {
            const saved = localStorage.getItem(STORAGE_KEY);
            this.messages = saved ? JSON.parse(saved) : [];
            this.$nextTick(() => this.scrollToBottom());
          } catch {
            this.messages = [];
          }
        },

        saveHistory() {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(this.messages));
        },

        buildContents() {
          return this.messages.map((entry) => ({
            role: entry.role === "assistant" ? "model" : "user",
            parts: [{ text: entry.content }],
          }));
        },

        async callGemini(model, contents) {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
          const res = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-goog-api-key": this.apiKey,
            },
            body: JSON.stringify({
              systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
              contents,
            }),
          });
          const data = await res.json();
          if (!res.ok) {
            const msg = data?.error?.message || "Gemini API request failed";
            throw new Error(msg);
          }
          return data.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I could not generate a response.";
        },

        async generateReply(contents) {
          const models = [MODEL, FALLBACK_MODEL];
          let lastError;
          for (const model of models) {
            try {
              return await this.callGemini(model, contents);
            } catch (err) {
              lastError = err;
              const msg = err.message || "";
              const retryable = /quota|429|503|UNAVAILABLE|high demand/i.test(msg);
              if (!retryable) throw err;
            }
          }
          throw lastError;
        },

        formatError(message) {
          if (/401|UNAUTHENTICATED|API key/i.test(message)) {
            return "Invalid API key. Click API Key and paste your Gemini key from Google AI Studio.";
          }
          if (/quota|429/i.test(message)) {
            return "Gemini quota exceeded. Wait a few minutes or try again later.";
          }
          if (/503|UNAVAILABLE|high demand/i.test(message)) {
            return "Gemini is busy. Wait a few seconds and try again.";
          }
          return message;
        },

        async sendMessage() {
          const text = this.input.trim();
          if (!text || this.loading) return;
          if (!this.apiKey) {
            this.showKeyModal = true;
            return;
          }

          this.error = "";
          this.input = "";
          this.loading = true;

          const userMsg = { id: Date.now(), role: "user", content: text };
          this.messages.push(userMsg);
          this.saveHistory();
          this.$nextTick(() => this.scrollToBottom());

          try {
            const reply = await this.generateReply(this.buildContents());
            this.messages.push({ id: Date.now() + 1, role: "assistant", content: reply });
            this.saveHistory();
          } catch (err) {
            this.messages = this.messages.filter((m) => m.id !== userMsg.id);
            this.saveHistory();
            this.error = this.formatError(err.message);
          } finally {
            this.loading = false;
            this.$nextTick(() => this.scrollToBottom());
          }
        },

        clearHistory() {
          if (this.loading || this.messages.length === 0) return;
          if (!confirm("Clear all chat history?")) return;
          this.messages = [];
          localStorage.removeItem(STORAGE_KEY);
          this.error = "";
        },

        scrollToBottom() {
          const el = this.$refs.messages;
          if (el) el.scrollTop = el.scrollHeight;
        },
      };
    }
  </script>
</body>
</html>
